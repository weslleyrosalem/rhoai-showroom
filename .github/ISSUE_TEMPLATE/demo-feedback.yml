name: Showroom feedback
description: Share a usability issue, a failed lab, or a question from a demonstration.
title: "[Showroom feedback] "
body:
  - type: markdown
    attributes:
      value: "This is a public issue. Use synthetic examples. Do not include credentials, private cluster URLs, account identifiers, or customer data."
  - type: dropdown
    id: journey
    attributes:
      label: Which conversation or lab?
      options:
        - Inference and cache
        - Models as a Service
        - Security and agents
        - Data science and ML engineering
        - Installation and GitOps
        - Guide navigation and presentation
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      placeholder: "For example: compare two AutoRAG patterns and understand why one ranked first."
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened, and what did you expect?
      description: Include reproducible steps and sanitized error text when useful.
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: What would make the demonstration more useful?
  - type: input
    id: version
    attributes:
      label: Guide revision or product version
      placeholder: "OpenShift AI 3.5.1; guide commit if known"
