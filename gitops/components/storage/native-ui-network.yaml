apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: showroom-native-ui-s3
  namespace: redhat-ods-applications
spec:
  podSelector:
    matchExpressions:
      - key: deployment
        operator: In
        values: [automl-ui, autorag-ui]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ai-showroom}
          podSelector:
            matchLabels: {app: showroom-s3}
      ports:
        - {port: 8333, protocol: TCP}
