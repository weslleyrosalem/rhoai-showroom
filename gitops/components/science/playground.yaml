apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aurora-pgvector
  namespace: ai-showroom
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aurora-pgvector-init
  namespace: ai-showroom
data:
  enable-pgvector.sh: |
    #!/bin/bash
    psql -U postgres -d "${POSTGRESQL_DATABASE}" -c "CREATE EXTENSION IF NOT EXISTS vector;"
---
apiVersion: v1
kind: Service
metadata:
  name: aurora-pgvector
  namespace: ai-showroom
spec:
  selector:
    app: aurora-pgvector
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurora-pgvector
  namespace: ai-showroom
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: aurora-pgvector
  template:
    metadata:
      labels:
        app: aurora-pgvector
    spec:
      containers:
      - image: registry.redhat.io/rhel9/postgresql-16@sha256:a348c03256ea3e1923b9134ac9ec14f374d5d70f22d89289fae3615e09508e44
        imagePullPolicy: Always
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - vectoruser
            - -d
            - vectordb
          failureThreshold: 3
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        name: postgresql
        ports:
        - containerPort: 5432
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - vectoruser
            - -d
            - vectordb
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
        startupProbe:
          exec:
            command:
            - pg_isready
            - -U
            - vectoruser
            - -d
            - vectordb
          failureThreshold: 18
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 1
        volumeMounts:
        - mountPath: /var/lib/pgsql/data
          name: pgdata
        - mountPath: /opt/app-root/src/postgresql-start
          name: init-scripts
          readOnly: true
        envFrom:
        - secretRef:
            name: aurora-pgvector-credentials
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: aurora-pgvector
      - name: init-scripts
        configMap:
          name: aurora-pgvector-init
          defaultMode: 493
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aurora-ogx-config
  namespace: ai-showroom
  labels:
    ogx.io/watch: 'true'
data:
  config.yaml: |
    version: '2'
    distro_name: rh
    apis:
    - responses
    - file_processors
    - files
    - inference
    - tool_runtime
    - vector_io
    providers:
      inference:
      - provider_id: sentence-transformers
        provider_type: inline::sentence-transformers
        config:
          trust_remote_code: false
      - provider_id: aurora-maas
        provider_type: remote::vllm
        config:
          base_url: ${env.MAAS_BASE_URL}
          api_token: ${env.MAAS_API_KEY}
          network:
            tls:
              verify: true
            headers:
              X-MaaS-Subscription: showroom-standard
      - provider_id: aurora-qwen-private
        provider_type: remote::vllm
        config:
          base_url: http://showroom-inference-maas-gateway-class.ai-showroom.svc.cluster.local:8080/ai-showroom/aurora-qwen-4b/v1
          api_token: user-token-required
          allowed_models:
          - aurora-qwen-4b
          max_tokens: 1024
      vector_io:
      - provider_id: pgvector
        provider_type: remote::pgvector
        config:
          db: ${env.PGVECTOR_DB:=vectordb}
          distance_metric: COSINE
          host: ${env.PGVECTOR_HOST}
          password: ${env.PGVECTOR_PASSWORD}
          persistence:
            backend: kv_default
            namespace: vector_io::pgvector
          port: ${env.PGVECTOR_PORT:=5432}
          user: ${env.PGVECTOR_USER:=vectoruser}
      responses:
      - provider_id: builtin
        provider_type: inline::builtin
        config:
          persistence:
            responses:
              backend: sql_default
              max_write_queue_size: 10000
              num_writers: 4
              table_name: responses
      file_processors:
      - provider_id: pypdf
        provider_type: inline::pypdf
        config: {}
      files:
      - provider_id: localfs-files
        provider_type: inline::localfs
        config:
          metadata_store:
            backend: sql_default
            table_name: files_metadata
          storage_dir: /opt/app-root/src/.ogx/distributions/rh/files
      tool_runtime:
      - provider_id: file-search
        provider_type: inline::file-search
        config: {}
      - provider_id: model-context-protocol
        provider_type: remote::model-context-protocol
        config: {}
    metadata_store:
      type: sqlite
      db_path: /opt/app-root/src/.ogx/distributions/rh/inference_store.db
    storage:
      backends:
        kv_default:
          db_path: /opt/app-root/src/.ogx/distributions/rh/kvstore.db
          type: kv_sqlite
        sql_default:
          db_path: /opt/app-root/src/.ogx/distributions/rh/sql_store.db
          type: sql_sqlite
      stores:
        connectors:
          backend: sql_default
          table_name: connectors
        conversations:
          backend: sql_default
          table_name: openai_conversations
        inference:
          backend: sql_default
          max_write_queue_size: 10000
          num_writers: 4
          table_name: inference_store
        metadata:
          backend: kv_default
          namespace: registry
        prompts:
          backend: sql_default
          table_name: prompts
    vector_stores:
      default_provider_id: pgvector
      default_embedding_model:
        provider_id: sentence-transformers
        model_id: paraphrase-multilingual-MiniLM-L12-v2
      annotation_prompt_params:
        enable_annotations: true
      file_ingestion_params:
        default_chunk_overlap_tokens: 128
        default_chunk_size_tokens: 512
      chunk_retrieval_params:
        chunk_multiplier: 5
        default_reranker_strategy: rrf
        default_search_mode: vector
        max_tokens_in_context: 4000
        rrf_impact_factor: 60
        weighted_search_alpha: 0.5
      file_batch_params:
        cleanup_interval_seconds: 86400
        file_batch_chunk_size: 10
        max_concurrent_files_per_batch: 3
    registered_resources:
      models:
      - provider_id: sentence-transformers
        model_id: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
        provider_model_id: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
        model_type: embedding
        metadata:
          embedding_dimension: 384
      - provider_id: aurora-maas
        model_id: ${env.MAAS_MODEL_ID}
        model_type: llm
        metadata:
          display_name: Aurora local LLM via MaaS
      - provider_id: sentence-transformers
        model_id: sentence-transformers/ibm-granite/granite-embedding-125m-english
        provider_model_id: ibm-granite/granite-embedding-125m-english
        model_type: embedding
        metadata:
          embedding_dimension: 768
      - provider_id: aurora-qwen-private
        model_id: aurora-qwen-4b
        provider_model_id: aurora-qwen-4b
        model_type: llm
        metadata:
          display_name: "Aurora Qwen \u2014 tools and policy knowledge"
          tool_calling: true
      vector_stores: []
    external_providers_dir: /opt/app-root/.llama/providers.d
    server:
      port: 8321
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aurora-ogx-private
  namespace: ai-showroom
spec:
  podSelector:
    matchLabels:
      app: ogx
      app.kubernetes.io/instance: lsd-genai-playground
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          notebook-name: aurora-lab
    - podSelector:
        matchLabels:
          app: aurora-rag
    - podSelector:
        matchExpressions:
        - key: workflows.argoproj.io/workflow
          operator: Exists
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redhat-ods-applications
      podSelector:
        matchLabels:
          app: rhods-dashboard
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redhat-ods-applications
      podSelector:
        matchLabels:
          deployment: autorag-ui
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redhat-ods-applications
      podSelector:
        matchLabels:
          deployment: gen-ai-ui
    ports:
    - port: 8321
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redhat-ods-monitoring
      podSelector:
        matchLabels:
          app.kubernetes.io/component: opentelemetry-collector
          app.kubernetes.io/instance: redhat-ods-monitoring.data-science-collector
    - namespaceSelector:
        matchLabels:
          network.openshift.io/policy-group: monitoring
    ports:
    - port: 9464
      protocol: TCP
---
apiVersion: ogx.io/v1beta1
kind: OGXServer
metadata:
  name: lsd-genai-playground
  namespace: ai-showroom
  labels:
    app.kubernetes.io/part-of: rhoai-showroom
    opendatahub.io/dashboard: 'true'
spec:
  distribution:
    name: rh
  network:
    port: 8321
    policy:
      enabled: false
  overrideConfig:
    name: aurora-ogx-config
    key: config.yaml
  workload:
    storage:
      size: 5Gi
      mountPath: /opt/app-root/src/.ogx/distributions/rh
    replicas: 1
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: '2'
        memory: 6Gi
    overrides:
      env:
      - name: PGVECTOR_HOST
        value: aurora-pgvector.ai-showroom.svc
      - name: PGVECTOR_DB
        value: vectordb
      - name: PGVECTOR_USER
        value: vectoruser
      - name: PGVECTOR_PASSWORD
        valueFrom:
          secretKeyRef:
            name: aurora-pgvector-credentials
            key: POSTGRESQL_PASSWORD
      - name: MAAS_API_KEY
        valueFrom:
          secretKeyRef:
            name: showroom-maas-key
            key: api-key
      - name: MAAS_BASE_URL
        valueFrom:
          secretKeyRef:
            name: showroom-maas-key
            key: base-url
      - name: MAAS_MODEL_ID
        valueFrom:
          secretKeyRef:
            name: showroom-maas-key
            key: model-id
      command:
      - /bin/sh
      - -c
      - ogx run /etc/ogx/config.yaml --insecure
