apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: aurora-rag
  namespace: ai-showroom
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: aurora-rag
  namespace: ai-showroom
spec:
  runPolicy: Serial
  source:
    type: Git
    git:
      uri: https://github.com/weslleyrosalem/rhoai-showroom.git
      ref: main
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: apps/aurora-rag/Containerfile
  output:
    to: {kind: ImageStreamTag, name: 'aurora-rag:latest'}
  triggers:
    - {type: ConfigChange}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurora-rag
  namespace: ai-showroom
spec:
  replicas: 1
  selector:
    matchLabels: {app: aurora-rag}
  template:
    metadata:
      labels: {app: aurora-rag, app.kubernetes.io/part-of: rhoai-showroom}
    spec:
      serviceAccountName: aurora-science
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: app
          image: image-registry.openshift-image-registry.svc:5000/ai-showroom/aurora-rag:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef: {name: aurora-science-config}
            - secretRef: {name: showroom-s3-credentials}
          env:
            - name: MAAS_API_KEY
              valueFrom: {secretKeyRef: {name: showroom-maas-key, key: api-key}}
            - name: MAAS_BASE_URL
              valueFrom: {secretKeyRef: {name: showroom-maas-key, key: base-url}}
            - name: MAAS_MODEL_ID
              valueFrom: {secretKeyRef: {name: showroom-maas-key, key: model-id}}
          ports:
            - {name: http, containerPort: 8080}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 30
          volumeMounts:
            - {name: service-ca, mountPath: /etc/service-ca, readOnly: true}
      volumes:
        - name: service-ca
          configMap: {name: showroom-service-ca}
---
apiVersion: v1
kind: Service
metadata:
  name: aurora-rag
  namespace: ai-showroom
spec:
  selector: {app: aurora-rag}
  ports:
    - {name: http, port: 8080, targetPort: http}
# Internal service only: use oc port-forward, or a platform-authenticated ingress.
