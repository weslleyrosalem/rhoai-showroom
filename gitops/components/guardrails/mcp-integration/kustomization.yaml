apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-showroom
resources:
  - ../base
  - workloads.yaml
  - networkpolicy.yaml
  - envoyfilter.yaml
configMapGenerator:
  - name: showroom-rails-bridge
    files: [bridge.py]
  - name: showroom-mcp-ipp
    files: [ipp-config.yaml]
patches:
  - target:
      kind: NemoGuardrails
      name: showroom-rails
    patch: |-
      - op: add
        path: /spec/template
        value:
          pod:
            mcpGateway:
              name: showroom-mcp
              namespace: ai-showroom
