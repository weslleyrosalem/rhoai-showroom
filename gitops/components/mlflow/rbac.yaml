apiVersion: v1
kind: ServiceAccount
metadata:
  name: aurora-science
  namespace: ai-showroom
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aurora-mlflow-writer
  namespace: ai-showroom
rules:
  - apiGroups: [mlflow.kubeflow.org]
    resources: [experiments, datasets, registeredmodels, prompts, traces]
    verbs: [get, list, create, update]
  - apiGroups: [mlflow.kubeflow.org]
    resources: [experiments/artifacts]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aurora-science-mlflow
  namespace: ai-showroom
subjects:
  - {kind: ServiceAccount, name: aurora-science, namespace: ai-showroom}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: aurora-mlflow-writer}
