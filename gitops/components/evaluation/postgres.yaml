# Community PostgreSQL image used only for the portable showroom overlay.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aurora-evaldb
  namespace: redhat-ods-applications
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 5Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurora-evaldb
  namespace: redhat-ods-applications
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: aurora-evaldb}
  template:
    metadata:
      labels: {app: aurora-evaldb, app.kubernetes.io/part-of: rhoai-showroom}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: quay.io/sclorg/postgresql-16-c9s@sha256:d8f615001e4ac90fcad78eb7353c15b78414b1314ff5b9925ac6376d4eec4c07
          envFrom:
            - secretRef: {name: aurora-evaldb-credentials}
          ports:
            - {containerPort: 5432, name: postgres}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 1Gi}
          readinessProbe:
            exec: {command: [sh, -c, 'pg_isready -U "$POSTGRESQL_USER" -d "$POSTGRESQL_DATABASE"']}
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/pgsql/data}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: aurora-evaldb}
---
apiVersion: v1
kind: Service
metadata:
  name: aurora-evaldb
  namespace: redhat-ods-applications
spec:
  selector: {app: aurora-evaldb}
  ports:
    - {port: 5432, targetPort: postgres, name: postgres}
