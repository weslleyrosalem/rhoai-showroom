apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aurora-evaluator
  namespace: ai-showroom
rules:
  - apiGroups: [trustyai.opendatahub.io]
    resources: [evaluations, collections, providers]
    verbs: [get, list, create]
  - apiGroups: [mlflow.kubeflow.org]
    resources: [experiments]
    verbs: [get, list, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aurora-science-evaluation
  namespace: ai-showroom
subjects:
  - {kind: ServiceAccount, name: aurora-science, namespace: ai-showroom}
  - {kind: ServiceAccount, name: aurora-lab, namespace: ai-showroom}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: aurora-evaluator}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: showroom-evalhub-clients
  namespace: redhat-ods-applications
spec:
  podSelector:
    matchLabels: {app: eval-hub, instance: evalhub}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ai-showroom}
      ports:
        - {protocol: TCP, port: 8443}
