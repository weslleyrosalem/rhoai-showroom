apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aurora-tools-gateway-only
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aurora-tools
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: showroom-mcp
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp-gateway
              app.kubernetes.io/managed-by: mcp-gateway-controller
      ports:
        - {protocol: TCP, port: 8000}
  egress: []
