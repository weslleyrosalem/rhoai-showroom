apiVersion: v1
kind: ServiceAccount
metadata:
  name: aurora-tools
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurora-tools
  labels:
    app.kubernetes.io/name: aurora-tools
    app.kubernetes.io/part-of: rhoai-showroom
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aurora-tools
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aurora-tools
        app.kubernetes.io/part-of: rhoai-showroom
    spec:
      serviceAccountName: aurora-tools
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tools
          image: image-registry.openshift-image-registry.svc:5000/ai-showroom/aurora-tools:1.0.0
          imagePullPolicy: Always
          env:
            - name: AURORA_ALLOWED_HOSTS
              value: "aurora-tools:*,aurora-tools,aurora-tools.ai-showroom.svc:*,aurora-tools.ai-showroom.svc,aurora-tools.ai-showroom.svc.cluster.local:*,aurora-tools.ai-showroom.svc.cluster.local,aurora-tools.mcp.internal:*,aurora-tools.mcp.internal,localhost:*,127.0.0.1:*"
            - name: AURORA_PRODUCTS_PATH
              value: /data/products.json
            - name: AURORA_FORECASTS_PATH
              value: /data/forecasts.json
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          configMap: {name: aurora-business-data}
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: aurora-tools
  labels:
    app.kubernetes.io/name: aurora-tools
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: aurora-tools
  ports:
    - {name: http, port: 8000, targetPort: http}
