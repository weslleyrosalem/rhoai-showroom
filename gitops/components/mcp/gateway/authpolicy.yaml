apiVersion: kuadrant.io/v1
kind: AuthPolicy
metadata:
  name: showroom-mcp-auth
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: showroom-mcp
    sectionName: mcp
  rules:
    authentication:
      openshift:
        # Replace using configure_gateway.py or a cluster overlay. Fail closed until configured.
        kubernetesTokenReview:
          audiences: [showroom-configure-api-audience-before-publication]
    authorization:
      showroom-identities:
        patternMatching:
          patterns:
            - predicate: >-
                auth.identity.user.username == 'aiadmin' ||
                auth.identity.user.username in ['system:serviceaccount:ai-showroom:showroom-visitor', 'system:serviceaccount:ai-showroom:showroom-engineer', 'system:serviceaccount:ai-showroom:aurora-science', 'system:serviceaccount:ai-showroom:aurora-lab'] ||
                (has(auth.identity.user.groups) && auth.identity.user.groups.exists(g, g in ['showroom-visitors', 'showroom-data-scientists', 'showroom-platform-admins']))
