apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aurora-tools
spec:
  parentRefs:
  - name: showroom-mcp
    sectionName: mcps
    group: gateway.networking.k8s.io
    kind: Gateway
  - name: showroom-mcp
    sectionName: mcp
    group: gateway.networking.k8s.io
    kind: Gateway
  hostnames:
  - aurora-tools.mcp.internal
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: aurora-tools
      port: 8000
      group: ''
      kind: Service
      weight: 1
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: aurora-tools
spec:
  prefix: aurora_
  path: /mcp
  category:
  - operations
  hint: Synthetic Aurora Supply catalog, inventory and read-only replenishment proposals.
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: aurora-tools
    namespace: ai-showroom
