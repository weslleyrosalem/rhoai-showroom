apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aurora-tools
spec:
  parentRefs:
    - {name: showroom-mcp, sectionName: mcps}
    # Gateway 0.7.1 discovery requires same-port attachment as extension.
    # Public listener still requires AuthPolicy; mcps remains private by NetworkPolicy.
    - {name: showroom-mcp, sectionName: mcp}
  hostnames: [aurora-tools.mcp.internal]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: aurora-tools, port: 8000}
---
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: aurora-tools
spec:
  prefix: aurora_
  path: /mcp
  category: [operations]
  hint: Synthetic Aurora Supply catalog, inventory and read-only replenishment proposals.
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: aurora-tools
    namespace: ai-showroom
