# RHCL 1.4 + RHOAI Authorino uses service-CA TLS on the authorization service.
# Scope only this Gateway; do not patch operator-owned Authorino or MaaS.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: showroom-mcp-auth-tls
spec:
  priority: -1
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: showroom-mcp
  configPatches:
    - applyTo: CLUSTER
      match:
        cluster:
          service: authorino-authorino-authorization.kuadrant-system.svc.cluster.local
      patch:
        operation: ADD
        value:
          name: kuadrant-auth-service
          type: STRICT_DNS
          connect_timeout: 1s
          http2_protocol_options: {}
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: kuadrant-auth-service
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: authorino-authorino-authorization.kuadrant-system.svc.cluster.local
                          port_value: 50051
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: authorino-authorino-authorization.kuadrant-system.svc
              common_tls_context:
                validation_context:
                  trusted_ca:
                    filename: /var/run/secrets/kubernetes.io/serviceaccount/service-ca.crt
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher:
                        exact: authorino-authorino-authorization.kuadrant-system.svc
