apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: showroom-mcp-lifecycle-isolation
  labels:
    app.kubernetes.io/part-of: rhoai-showroom
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  priority: 70
  subject:
    pods:
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ai-showroom
      podSelector:
        matchLabels:
          showroom.aurora/component: lifecycle-test-drive
  ingress:
  - name: allow-lifecycle-handshake
    action: Allow
    from:
    - pods:
        namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: redhat-ods-applications
        podSelector:
          matchLabels:
            app.kubernetes.io/name: mcp-lifecycle-operator
    ports:
    - portNumber:
        protocol: TCP
        port: 8000
  - name: deny-other-pods
    action: Deny
    from:
    - namespaces: {}
  egress:
  - name: deny-all-ipv4-and-ipv6
    action: Deny
    to:
    - networks:
      - 0.0.0.0/0
      - ::/0
