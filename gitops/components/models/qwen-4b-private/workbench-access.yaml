# Optional notebook access to the existing authenticated private Gateway.
# The projected Workbench token uses the API audience accepted by TokenReview.
# This role grants model invocation through native SAR, not model administration.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: showroom-qwen-workbench-inference
  namespace: ai-showroom
  labels:
    app.kubernetes.io/part-of: rhoai-showroom
    app.kubernetes.io/component: private-inference
rules:
- apiGroups: [serving.kserve.io]
  resources: [llminferenceservices]
  resourceNames: [aurora-qwen-4b]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: showroom-qwen-workbench-inference
  namespace: ai-showroom
  labels:
    app.kubernetes.io/part-of: rhoai-showroom
    app.kubernetes.io/component: private-inference
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: showroom-qwen-workbench-inference
subjects:
- kind: ServiceAccount
  name: aurora-lab
  namespace: ai-showroom
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: showroom-qwen-workbench-gateway
  namespace: ai-showroom
  labels:
    app.kubernetes.io/part-of: rhoai-showroom
    app.kubernetes.io/component: private-inference
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: showroom-inference
  policyTypes: [Ingress]
  ingress:
  - from:
    # A podSelector without namespaceSelector matches this namespace only.
    - podSelector:
        matchLabels:
          app: aurora-lab
          notebook-name: aurora-lab
    ports:
    - protocol: TCP
      port: 8080
