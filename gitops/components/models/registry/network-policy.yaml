apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: showroom-registry-proxy-only
  namespace: rhoai-model-registries
  labels:
    app.kubernetes.io/part-of: rhoai-showroom
spec:
  podSelector:
    matchLabels:
      app: aurora-registry
      app.kubernetes.io/name: aurora-registry
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-applications
      ports:
        - protocol: TCP
          port: 8443
